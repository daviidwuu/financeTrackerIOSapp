name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    name: Build and Test iOS App
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run Build and Tests
        run: |
          set -o pipefail
          xcodebuild clean build test \
            -project FinanceTracker.xcodeproj \
            -scheme FinanceTracker \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            | xcpretty -c || xcodebuild clean build test -project FinanceTracker.xcodeproj -scheme FinanceTracker -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest'
