name: Firebase CI

on:
  push:
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
    branches: [ "main" ]
  pull_request:
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
    branches: [ "main" ]

jobs:
  build_and_test:
    name: Build and Test Firebase
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./functions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./functions/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # Future testing step:
      # - name: Run Unit Tests
      #   run: npm test
